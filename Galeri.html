<!DOCTYPE html>

    <style>
        body {
            background-color: #111111;
            color: #FFFFFF;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        /* KOTAK UTAMA CAROUSEL */
        .slider-container {
            width: 100%;
            max-width: 1000px;
            height: 1000px;
            margin: 0 auto;
            overflow: hidden;
            position: relative;
            border: 1px solid #333333;
            border-radius: 6px;
            background-color: #1e1e1e;
        }
        /* TRACK GAMBAR (Default-nya diam / paused) */
        .slider-track {
            display: flex;
            width: 800%; /* 8 gambar x 100% */
            animation: smoothSlide 20s infinite ease-in-out;
            animation-play-state: paused; /* DIAM KETIKA KURSOR TIDAK DI ATASNYA */
        }
        
        /* KETIKA KURSOR DIARAHKAN KE GAMBAR, ANIMASI BERGERAK PERLAHAN */
        .slider-container:hover .slider-track {
            animation-play-state: running; 
        }

        .slider-track img {
            width: 100%;
            max-width: 1000px;
            height: 1000px;
            object-fit: cover;
        }

        /* ANIMASI GESER PERLAHAN */
        @keyframes smoothSlide {
            1%, 5%    { transform: translateX(0%); }
            10%, 15%  { transform: translateX(-12.5%); }
            20%, 25%  { transform: translateX(-25%); }
            30%, 35%  { transform: translateX(-37.5%); }
            40%, 45%  { transform: translateX(-50%); }
            50%, 55%  { transform: translateX(-62.5%); }
            60%, 65%  { transform: translateX(-75%); }
            70%       { transform: translateX(0%); }
        }
    </style>
</head>
